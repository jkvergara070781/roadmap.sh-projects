<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="nav-logo">Logo</div>
        <ul class="nav-links">
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Contact</a></li>
        </ul>
    </header>
    <main class="container">
        <figure>
            <img src="https://picsum.photos/id/288/500/300"
                alt="An elevated, wide-angle view of Stockholm's Gamla Stan (Old Town), showing dense clusters of historic colorful buildings with classic European architecture under a partly cloudy sky."
                width="600" height="400">
            <figcaption>An aerial view looking over the vibrant historic architecture and prominent church spires of
                Gamla Stan in Stockholm, Sweden.</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/237/500/300"
                alt="A black Labrador puppy lies on a rustic wooden deck, looking upward toward the camera with wide, expressive eyes."
                width="600" height="400">
            <figcaption>A black Labrador pupply resting on weathered wooden planks.</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/59/500/300"
                alt="A rustic, weathered wooden fence post stands on a grassy hill with strands of barbed wire stretching across the landscape against a pale, overcast sky."
                width="600" height="400">
            <figcaption>A vintage-style photograph of an old, weathered barbed wire fence running along a grassy ridge
                line.</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/30/500/300"
                alt="A white ceramic mug featuring a vintage-style red and blue Cuban stamp collage design, sitting on a textured surface with a blurred background."
                width="600" height="400">
            <figcaption>A coffee mug decorated with a collage of vintage Republic of Cuba postage stamps, featuring a
                portrait and postal markings.</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/20/500/300"
                alt="A flat lay, top-down view of a wooden desk neatly arranged with study and design materials."
                width="600" height="400">
            <figcaption>An overhead view of a modern workstation featuring design reference books, a laptop, and
                stationery tools organized on a light wood desktop.</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/95/500/300" alt="" width="600" height="400">
            <figcaption>A serene yet eerie park landscape enshrouded in thick autumn fog, highlighting the stark
                silhouettes of leafless trees.</figcaption>
        </figure>
        <figure>
            <video width="600" height="400" controls poster="./thumbnail.png">
                <source src="./duck-video.mp4" type="video/mp4">
            </video>
        </figure>
    </main>
    <footer>
        &copy;2026. All rights reserved.
    </footer>
</body>
</html>
