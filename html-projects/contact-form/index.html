<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="nav-container">
        <div class="nav-logo">Acme Support</div>
        <ul class="nav-links">
            <li><a href="">Home</a></li>
            <li><a href="">Help</a></li>
            <li><a href="">Contact</a></li>
        </ul>
    </header>
    <hr />
    <main>
        <div class="text">
            <h1>Contact us</h1>
            <p>Send us a message and we will get back to you.</p>
        </div>
        <form action="/submit-data-endpoint" method="post">
            <div class="text-input">
                <label for="full-name">Full name</label>
                <input type="text" id="full-name" name="full-name" required />
            </div>
            <div class="email-input">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required />
            </div>
            <div class="select-input">
                <label for="subject">Subject</label>
                <select name="subject" id="subject">
                    <option value="choose-topic">Choose a topic</option>
                    <option value="technical">Technical</option>
                    <option value="commercial">Commercial</option>
                    <option value="others">Others</option>
                </select>
            </div>
            <div class="textarea-input">
                <label for="message">Message</label>
                <textarea name="message" id="message" rows="4" cols="30" minlength="100" required></textarea>
            </div>
            <fieldset>
                <legend>How did you hear about us?</legend>
                <div>
                    <input type="radio" id="search" name="about-us" value="search" />
                    <label for="search">Search</label>
                </div>
                <div>
                    <input type="radio" id="friend" name="about-us" value="friend" />
                    <label for="friend">Friend</label>
                </div>
                <div>
                    <input type="radio" name="about-us" id="social-media" value="social-media" />
                    <label for="social-media">Social Media</label>
                </div>
            </fieldset>
            <div class="checkbox-input">
                <input type="checkbox" name="product-update" id="product-update" value="yes" />
                <label for="product-update">Send me product updates</label>
            </div>
            <div class="submit-input">
                <button type="submit">Send message</button>
            </div>
        </form>
    </main>
    <hr />
    <footer>&copy; 2026 Acme Support</footer>
</body>

</html>
