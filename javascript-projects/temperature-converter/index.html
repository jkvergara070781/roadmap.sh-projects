    <div class="converter-card">
      <h2>Temperature Converter</h2>

      <div class="form-group">
        <label for="tempInput">Temperature Value</label>
        <input
          type="number"
          id="tempInput"
          placeholder="Enter value..."
          step="any"
        />
      </div>

      <div class="form-group">
        <label for="fromUnit">Convert From</label>
        <select id="fromUnit">
          <option value="" disabled selected>Select starting unit</option>
          <option value="C">Celsius (°C)</option>
          <option value="F">Fahrenheit (°F)</option>
          <option value="K">Kelvin (K)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="toUnit">Convert To</label>
        <select id="toUnit">
          <option value="" disabled selected>Select target unit</option>
          <option value="C">Celsius (°C)</option>
          <option value="F">Fahrenheit (°F)</option>
          <option value="K">Kelvin (K)</option>
        </select>
      </div>

      <button id="convertBtn" disabled>Convert</button>

      <div class="result-container" id="resultContainer">
        <p class="result-text" id="resultText"></p>
      </div>
    </div>
    <script src="script.js"></script>
