<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Accessible Form UI</title>
  </head>
  <body>
    <div class="container">
      <h1>Create Account</h1>
      <div class="form-container">
        <form action="">
          <div class="fullname-group">
            <label for="fullname">Full Name</label>
            <input
              type="text"
              name="fullname"
              id="fullname"
              required
              aria-describedby="req-fullname"
            />
          </div>
          <div class="email-group">
            <label for="email-add">Email Address</label>
            <input
              type="email"
              name="email-add"
              id="email-add"
              required
              aria-invalid="true"
              aria-describedby="req-email"
            />
          </div>
          <div class="create-password-group">
            <label for="create-password">Create Password</label>
            <input
              type="password"
              name="create-password"
              id="create-password"
              required
              aria-describedby="req-password"
              autocomplete="new-password"
            />
            <i class="fa-solid fa-eye"></i>
          </div>
          <div class="checkbox-group">
            <input
              type="checkbox"
              id="terms"
              aria-describedby="req-terms"
              required
            />
            <label for="terms">I agree with the Terms and Privacy Policy</label>
          </div>
        </form>
      </div>
      <div id="form-status-announcer" aria-live="polite" class="sr-only">
        Form is 0% complete. 4 requirements remaining.
      </div>
      <div
        class="progress-circle-container"
        role="progressbar"
        aria-label="Profile completeness progress"
        aria-valuenow="0"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <svg class="progress-circle-svg" viewBox="0 0 36 36">
          <circle class="circle-bg" cx="18" cy="18" r="14" />
          <circle id="circle-fill" class="circle-fill" cx="18" cy="18" r="14" />
        </svg>
        <div id="progress-text-overlay" class="progress-text-overlay">0%</div>
      </div>
      <div class="checklist-container">
        <ul class="checklist" aria-label="Required Steps">
          <li id="req-name" class="checklist-item">Provide full name</li>
          <li id="req-email" class="checklist-item">
            Provide valid email address
          </li>
          <li id="req-password" class="checklist-item">
            Password (min. 8 characters)
          </li>
          <li id="req-terms" class="checklist-item">
            Accept terms and conditions
          </li>
        </ul>
      </div>
      <button type="submit" id="submit-btn" disabled>
        Complete Registraion
      </button>
    </div>
  </body>
</html>
