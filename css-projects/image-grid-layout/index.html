<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Image Grid Layout</title>
  </head>
  <body>
    <div class="grid-container">
      <div class="item image-1">
        <img
          src="./images/image-1.jpg"
          alt="Stack of red and black Coca-Cola crates filled with glass bottles on a city sidewalk"
        />
      </div>
      <div class="item image-2">
        <img
          src="./images/image-2.jpg"
          alt="An Atlantic puffin with a colorful orange and gray beak peeking out from behind green foliage and white wildflowers against a soft blue sky."
        />
      </div>
      <div class="item image-3">
        <img
          src="./images/image-3.jpg"
          alt="A surfer in a black wetsuit riding a large, crashing wave with white ocean foam."
        />
      </div>
      <div class="item image-4">
        <img
          src="./images/image-4.jpg"
          alt="An orange and white Munchkin cat wearing a mini McDonald's uniform bib, peeking out between two white cushions."
        />
      </div>
      <div class="item image-5">
        <img
          src="./images/image-5.jpg"
          alt="Three pieces of textured white coral skeletons arranged on a beige background with soft shadows."
        />
      </div>
      <div class="item image-6">
        <img
          src="./images/image-6.jpg"
          alt="An aerial view shows four people working on laptops around a light wooden table covered in tech gear, notebooks, snacks, and drinks."
        />
      </div>
    </div>
  </body>
</html>
